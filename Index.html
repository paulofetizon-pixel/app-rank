<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0B0F14">

  <meta name="apple-mobile-web-app-title" content="Rangs">
  <title>Rangs</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0B0F14;
      --surface: #141B22;
      --surface-2: #1B242D;
      --border: #26313B;
      --text: #EAEFF2;
      --muted: #8A97A3;
      --bronze: #B08D57;
      --silver: #C4CBD4;
      --gold: #E8B94D;
      --platine: #7FE3D8;
      --diamant: #7FA8FF;
      --mythique: #C77FFF;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, sans-serif;
      overscroll-behavior-y: none;
      -webkit-overflow-scrolling: touch;
    }
    body {
      padding-bottom: calc(76px + env(safe-area-inset-bottom));
      padding-top: env(safe-area-inset-top);
    }
    h1, h2, h3, .display {
      font-family: Oswald, sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .mono { font-family: "JetBrains Mono", monospace; }
    .app {
      max-width: 520px;
      margin: 0 auto;
      padding: 20px 18px 8px;
    }
    .topbar {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 18px;
    }
    .topbar .brand {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.06em;
    }
    .topbar .brand span { color: var(--gold); }
    .topbar .xp {
      font-size: 12px;
      color: var(--muted);
    }
    .topbar .xp b {
      color: var(--text);
      font-family: "JetBrains Mono", monospace;
    }
    .screen { display: none; }
    .screen.active { display: block; animation: fadein 0.25s ease; }
    @keyframes fadein {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .radar-card {
      background: radial-gradient(circle at 50% 30%, #1a2530, var(--surface) 70%);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px 8px 10px;
      margin-bottom: 18px;
    }
    .radar-title {
      font-size: 11px;
      color: var(--muted);
      text-align: center;
      margin-bottom: 2px;
      letter-spacing: 0.12em;
    }
    #radar { display: block; width: 100%; height: auto; }
    .radar-node-label {
      font-size: 9px;
      fill: var(--muted);
      font-family: Inter, sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .section-label {
      font-size: 12px;
      color: var(--muted);
      margin: 22px 0 10px;
      letter-spacing: 0.1em;
    }
    .muscle-row {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 8px;
      cursor: pointer;
    }
    .muscle-row.active { background: var(--surface-2); }
    .tier-dot {
      width: 10px;
      height: 10px;
      border-radius: 3px;
      flex-shrink: 0;
      transform: rotate(45deg);
    }
    .muscle-info { flex: 1; min-width: 0; }
    .muscle-name {
      font-size: 14.5px;
      font-weight: 600;
    }
    .muscle-rank {
      font-size: 11.5px;
      color: var(--muted);
      margin-top: 2px;
    }
    .muscle-rank b { font-weight: 600; }
    .muscle-bar-wrap {
      width: 100%;
      height: 5px;
      background: var(--surface-2);
      border-radius: 3px;
      margin-top: 6px;
      overflow: hidden;
    }
    .muscle-bar {
      height: 100%;
      border-radius: 3px;
    }
    .muscle-score {
      font-size: 15px;
      font-weight: 700;
      flex-shrink: 0;
      width: 38px;
      text-align: right;
    }
    .btn {
      display: block;
      width: 100%;
      text-align: center;
      background: var(--gold);
      color: #141313;
      font-weight: 700;
      border: none;
      border-radius: 14px;
      padding: 15px;
      font-size: 15px;
      letter-spacing: 0.02em;
      cursor: pointer;
      font-family: Inter, sans-serif;
    }
    .btn.active { opacity: 0.85; }
    .btn.ghost {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn.small {
      padding: 10px;
      font-size: 13px;
      border-radius: 10px;
    }
    .btn.danger {
      background: transparent;
      color: #E06B6B;
      border: 1px solid #3a2323;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
    }
    .field { margin-bottom: 14px; }
    .field label {
      display: block;
      font-size: 11.5px;
      color: var(--muted);
      margin-bottom: 6px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    select, input[type="number"], input[type="text"], input[type="date"] {
      width: 100%;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 12px;
      border-radius: 10px;
      font-size: 15px;
      font-family: Inter, sans-serif;
      -webkit-appearance: none;
      appearance: none;
    }
    select:focus, input:focus {
      outline: 1px solid var(--gold);
    }
    .exo-block {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .exo-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .exo-head .name {
      font-weight: 600;
      font-size: 14.5px;
    }
    .exo-head .muscle-tag {
      font-size: 10.5px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .set-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
    }
    .set-row input {
      flex: 1;
      padding: 10px;
      font-size: 14px;
    }
    .set-row .set-num {
      width: 20px;
      font-size: 12px;
      color: var(--muted);
      font-family: "JetBrains Mono", monospace;
      flex-shrink: 0;
    }
    .set-row .rm {
      width: 32px;
      height: 32px;
      flex-shrink: 0;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1;
    }
    .add-set {
      background: none;
      border: 1px dashed var(--border);
      color: var(--muted);
      border-radius: 10px;
      padding: 8px;
      width: 100%;
      font-size: 13px;
      margin-top: 2px;
    }
    .remove-exo {
      background: none;
      border: none;
      color: #E06B6B;
      font-size: 12px;
      padding: 0;
    }
    .navbar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(20,27,34,0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-top: 1px solid var(--border);
      padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    }
    .navbar-inner {
      max-width: 520px;
      margin: 0 auto;
      display: flex;
      justify-content: space-around;
    }
    .nav-btn {
      background: none;
      border: none;
      color: var(--muted);
      font-family: Inter, sans-serif;
      font-size: 11px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 4px 14px;
    }
    .nav-btn.active { color: var(--gold); }
    .nav-btn .ic {
      width: 20px;
      height: 20px;
    }
    .hist-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 10px;
      cursor: pointer;
    }
    .hist-date {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.05em;
    }
    .hist-summary {
      font-size: 14px;
      font-weight: 600;
      margin-top: 4px;
    }
    .hist-muscles {
      font-size: 11.5px;
      color: var(--muted);
      margin-top: 4px;
    }
    .empty {
      text-align: center;
      color: var(--muted);
      padding: 40px 20px;
      font-size: 13.5px;
    }
    .empty b {
      display: block;
      color: var(--text);
      font-size: 16px;
      margin-bottom: 6px;
      font-family: Oswald, sans-serif;
      text-transform: uppercase;
    }
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(4,6,8,0.7);
      display: none;
      align-items: flex-end;
      z-index: 50;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: var(--bg);
      border-top: 1px solid var(--border);
      border-radius: 20px 20px 0 0;
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding: 20px 20px calc(28px + env(safe-area-inset-bottom));
      max-height: 82vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .modal-handle {
      width: 36px;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin: 0 auto 16px;
    }
    .modal-close {
      position: absolute;
      top: 16px;
      right: 20px;
      background: none;
      border: none;
      color: var(--muted);
      font-size: 22px;
    }
    .rank-big {
      text-align: center;
      margin: 6px 0 18px;
    }
    .rank-big .num {
      font-size: 44px;
      font-weight: 700;
      font-family: Oswald, sans-serif;
    }
    .rank-big .lbl {
      font-size: 13px;
      color: var(--muted);
      margin-top: 2px;
    }
    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin: 16px 0;
    }
    .stat-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      text-align: center;
    }
    .stat-box .v {
      font-size: 16px;
      font-weight: 700;
      font-family: "JetBrains Mono", monospace;
    }
    .stat-box .l {
      font-size: 9.5px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-top: 3px;
    }
    .toast {
      position: fixed;
      top: calc(16px + env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      background: var(--surface);
      border: 1px solid var(--border);
